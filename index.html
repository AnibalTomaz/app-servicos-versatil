<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f4c81">
<title>APP SERVIÇOS VERSÁTIL</title><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Versátil">
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css?v=2290">
</head><body><div id="appVersionBadge">v2.29</div><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
window.addEventListener('error',function(ev){
  const app=document.getElementById('app');
  if(app && !app.innerHTML.trim()){
    app.innerHTML='<div style="max-width:620px;margin:40px auto;padding:20px;font-family:Arial;background:#fff;border:1px solid #ddd;border-radius:12px"><h2>APP SERVIÇOS VERSÁTIL</h2><p>Não foi possível carregar o aplicativo.</p><p style="font-size:12px;color:#666">Erro: '+String(ev.message||'desconhecido')+'</p><button onclick="location.reload(true)" style="padding:10px 16px">Tentar novamente</button></div>';
  }
});
</script>
<script src="app.js?v=2290"></script><script>
if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    try{
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs)await reg.update();
      await navigator.serviceWorker.register('service-worker.js?v=2290',{updateViaCache:'none'});
    }catch(e){console.warn('Service Worker:',e)}
  });
}
</script></body></html>
